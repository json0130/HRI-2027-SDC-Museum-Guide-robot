<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Museum live profile</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#6b7380;--line:#dfe3e8;--pos:#1f8f5f;--neg:#c2410c;--acc:#2f5fd0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e6e9ee;--mute:#8d96a3;--line:#2a313b;--pos:#3ecf8e;--neg:#fb923c;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;flex:1}button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.2fr);gap:12px;padding:12px 16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 8px}
img#v{width:100%;border-radius:6px;background:#000;display:block}
#chat{height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{padding:6px 9px;border-radius:8px;max-width:92%;white-space:pre-wrap}.m.robot{background:var(--bg);align-self:flex-start}.m.visitor{background:var(--acc);color:#fff;align-self:flex-end}
.meta{font-size:11px;color:var(--mute)}form{display:flex;gap:6px;margin-top:8px}input{flex:1;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.dim{margin:8px 0}.bar{position:relative;height:10px;background:var(--bg);border-radius:5px;border:1px solid var(--line)}
.bar i{position:absolute;top:0;bottom:0}.bar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mute)}
.row{display:flex;justify-content:space-between;font-size:12px}.pill{padding:1px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
svg{width:100%;height:300px}.hint{color:var(--mute);font-size:12px}
</style></head><body>
<header><h1>Museum live profile <span class="meta" id="vid"></span></h1><span class="pill" id="sus"></span>
<button class="ghost" id="new">New visit</button><button id="end">End visit (wipe)</button></header>
<main>
<div>
 <div class="card"><h2>Camera (debug overlay)</h2><img id="v" src="/video" alt="camera"><div class="hint" id="faces"></div></div>
 <div class="card"><h2>Conversation</h2><div id="chat"></div>
  <form id="f"><input id="t" autocomplete="off" placeholder="Say something as the visitor..."><button>Send</button></form></div>
</div>
<div>
 <div class="card"><h2>Profile (value x confidence; bar from centre)</h2><div id="prof" class="hint">Waiting for a face...</div></div>
 <div class="card"><h2>Live knowledge graph (this visit only)</h2><svg id="g" viewBox="0 0 520 300"></svg><div class="hint">green = like / high end, orange = dislike / low end; thickness = confidence</div></div>
 <div class="card"><h2>Policy steps</h2><table id="log"><tr><td class="hint">none yet</td></tr></table></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id), api=(p,b)=>fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const LAB={talk_level:['quiet','chatty'],depth:['brief','detailed'],pace:['slow','fast']};
let lastMsgs=-1;
function bar(ev,conf){const w=Math.abs(ev)*50,c=ev>=0?'var(--pos)':'var(--neg)';return `<div class="bar"><b></b><i style="${ev>=0?'left:50%':'right:50%'};width:${w}%;background:${c};opacity:${.35+.65*conf}"></i></div>`}
function draw(s){
 $('vid').textContent=s.visit_id?'visit '+s.visit_id:'';$('sus').textContent=s.ended?'visit ended: all person data wiped':('dropped writes: '+(s.suspended_writes||0));
 $('faces').textContent=(s.faces||[]).map(f=>`${f.person_id}: ${f.band} (${f.confidence.toFixed(2)}), track ${f.track_conf.toFixed(1)}, ${f.n_frames} frames`).join('  |  ');
 const ids=Object.keys(s.persons||{});
 $('prof').innerHTML=ids.length?ids.map(p=>{const P=s.persons[p],L=s.levels[p]||{},pend=s.pending[p];
  let h=`<b>${p}</b> <span class="pill">${s.met[p]?'opening: '+s.met[p].row_id:'not met yet'}</span>`;
  h+=P.prior?` <span class="pill">opening hint: ${P.prior.band} (${P.prior.use})</span>`:' <span class="pill">opening hint dropped: real evidence exists</span>';
  if(pend)h+=` <span class="pill">waiting: ${pend.kind}${pend.dim?' '+pend.dim:''}</span>`;
  for(const d in P.dimensions){const x=P.dimensions[d];h+=`<div class="dim"><div class="row"><span>${LAB[d][0]} &larr; ${d} &rarr; ${LAB[d][1]}</span><span>eff ${x.effective_value.toFixed(2)} &middot; conf ${x.confidence.toFixed(2)} &middot; ${x.evidence_count} ev &middot; level ${L[d]||0}</span></div>${bar(x.effective_value,x.confidence)}</div>`}
  h+='<div>likes: '+(P.likes.map(t=>`${t.label} (${t.effective_value.toFixed(2)})`).join(', ')||'-')+'</div><div>dislikes: '+(P.dislikes.map(t=>`${t.label} (${t.effective_value.toFixed(2)})`).join(', ')||'-')+'</div>';
  return `<div style="margin-bottom:10px">${h}</div>`}).join(''):'<span class="hint">Waiting for a face...</span>';
 const ms=s.messages||[];if(ms.length!==lastMsgs){lastMsgs=ms.length;$('chat').innerHTML=ms.map(m=>`<div class="m ${m.who}">${m.text.replace(/</g,'&lt;')}${m.meta?`<div class="meta">${m.meta}</div>`:''}</div>`).join('');$('chat').scrollTop=1e9}
 $('log').innerHTML=(s.step_log||[]).slice().reverse().map(r=>`<tr><td>t${r.turn}</td><td>${r.kind}${r.reversal?' (reversal)':''}</td><td>${r.dim||''}</td><td>${r.gate||''}</td><td>${r.outcome||''}</td></tr>`).join('')||'<tr><td class="hint">none yet</td></tr>';
 graph(s.graph||{nodes:[],edges:[]});
}
function graph(G){const W=520,H=300,svg=$('g'),cols={style_dim:70,person:260,topic:450},by={};G.nodes.forEach(n=>(by[n.type]=by[n.type]||[]).push(n));
 const pos={};for(const t in by)by[t].forEach((n,i)=>pos[n.id]=[cols[t],(i+1)*H/(by[t].length+1)]);
 let h='';G.edges.forEach(e=>{const a=pos[e.source],b=pos[e.target];if(!a||!b)return;const v=e.value*e.confidence;h+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${v>=0?'var(--pos)':'var(--neg)'}" stroke-width="${1+4*e.confidence}" opacity="${.3+.7*Math.min(1,Math.abs(v)+.2)}"><title>value ${e.value.toFixed(2)} conf ${e.confidence.toFixed(2)} ${e.evidence} ev (${e.sources.join(', ')})</title></line>`});
 G.nodes.forEach(n=>{const p=pos[n.id];h+=`<circle cx="${p[0]}" cy="${p[1]}" r="${n.type==='person'?16:10}" fill="var(--card)" stroke="var(--acc)" stroke-width="2"/><text x="${p[0]}" y="${p[1]+(n.type==='person'?30:24)}" text-anchor="middle" font-size="11" fill="var(--ink)">${n.label}</text>`});svg.innerHTML=h}
async function tick(){try{draw(await api('/state'))}catch(e){}setTimeout(tick,700)}tick();
$('f').onsubmit=async e=>{e.preventDefault();const t=$('t').value;if(!t)return;$('t').value='';await api('/chat',{text:t})};
$('end').onclick=()=>api('/end',{});$('new').onclick=()=>{lastMsgs=-1;api('/new',{})};
</script></body></html>
